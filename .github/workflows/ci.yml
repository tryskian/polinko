name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: "pip"
          cache-dependency-path: requirements.txt
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Build hygiene
        env:
          OPENAI_API_KEY: sk-test-key-123456789012345
          POLINKO_SERVER_API_KEY: test-server-key
        run: make build-hygiene-core PYTHON=python

  markdownlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
      - name: Install Node dependencies
        run: npm ci
      - name: Docs checks
        run: make ci-docs PYTHON=python

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: "pip"
          cache-dependency-path: requirements.txt
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Editable package install
        run: make package-install-check PYTHON=python
      - name: Unit tests
        env:
          OPENAI_API_KEY: sk-test-key-123456789012345
          POLINKO_SERVER_API_KEY: test-server-key
        run: make ci-test PYTHON=python

  python-style:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: "pip"
          cache-dependency-path: requirements.txt
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Ruff checks
        run: make ci-python-style PYTHON=python

  python-type-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: "pip"
          cache-dependency-path: requirements.txt
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Mypy checks
        run: make ci-python-type-check PYTHON=python

  python-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: "pip"
          cache-dependency-path: requirements.txt
      - name: Install audit and locked deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Python security and lock check
        run: make ci-python-security PYTHON=python

  node-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
      - name: Install Node dependencies
        run: npm ci
      - name: Verify tracked npm lockfile coverage
        run: |
          expected="$(printf '%s\n' \
            '.archive/quarantine/portfolio-2026-06-29/apps/portfolio/package-lock.json' \
            'package-lock.json' | LC_ALL=C sort)"
          tracked="$(git ls-files -- 'package-lock.json' ':(glob)**/package-lock.json' | LC_ALL=C sort)"
          if [ "$tracked" != "$expected" ]; then
            echo 'Tracked npm lockfiles changed. Update the audit steps and Dependabot directories.'
            diff -u <(printf '%s\n' "$expected") <(printf '%s\n' "$tracked") || true
            exit 1
          fi
      - name: Audit Node dependencies
        run: make ci-node-security
      - name: Audit archived portfolio lockfile
        if: ${{ !cancelled() }}
        working-directory: .archive/quarantine/portfolio-2026-06-29/apps/portfolio
        run: npm audit --audit-level=moderate
